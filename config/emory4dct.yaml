dataset:
    name: "Emory-4DCT"
    root: "data/Emory-4DCT"
    subjects: ["case1", "case2", "case3", "case4", "case5", "case6", "case7", "case8", "case9", "case10"]
    variant: "TEST"
    state_pairs:
        - ["T50", "T00"]
    pipeline_tags:
        image_resampling:   "iso"
        image_segmentation: "v3d"
        image_registration: "lung"

preprocessing:
    image_resampling: {"spacing": [1.0, 1.0, 1.0], "interpolator": "bspline", "default_value": -1024.}
    image_segmentation:
        tasks:
          - method: "TotalSegmentator"
            kwargs:
                task: "total"
                roi_subset: ["lung_upper_lobe_right", "lung_middle_lobe_right", "lung_lower_lobe_right", "lung_upper_lobe_left", "lung_lower_lobe_left"]
          - method: "TotalSegmentator"
            kwargs:
                task: "lung_vessels"
          - method: "VisionFeature"
            kwargs:
                model: "vista3d"
                results_dir: "/restricted/projectnb/batmanlab/haozhe/Lung_Mesh_Segment/data/nnUNetv2/nnUNet_results"
          - method: "HU_threshold"
            kwargs:
                thresholds:
                    lt-950: {"operator": "<", "value": -950}
                    lt-910: {"operator": "<", "value": -910}
                    lt-850: {"operator": "<", "value": -850}
                    gt-500: {"operator": ">", "value": -500}
                    gt-200: {"operator": ">", "value": -200}
    image_registration:
        method: "unigradicon"
        kwargs:
            model: "gradiconlung"
            similarity: "lncc2"
            sigma: 1
            iterations: 50
            loss_function_masking: true
            intensity_conservation: true
            weights_root: "/projectnb/batmanlab/mragoza/lung-project/network_weights"
    anatomical_regions:
        roi_order: ["lung_upper_lobe_right", "lung_middle_lobe_right", "lung_lower_lobe_right", "lung_upper_lobe_left", "lung_lower_lobe_left"]
        filter_kws: {"min_voxels": 30, "keep_largest": true}
    mesh_generation:
        use_search: True
        pygalmesh_kws:
            max_cell_circumradius: 3.75
            max_facet_distance: 1.0
            lloyd: true
            odt: true
    field_interpolation:
        displacement_key: "u_reg"

optimization:
    parameters:
        E: {"mode": "log10", "v_loc": 3000., "scale": 0.3271}
        nu: {"mode": "logit", "v_min": 0.0001, "v_max": 0.4999}
        rho: {"mode": "log10", "v_loc": 250., "scale": 0.1}
    pde_solver:
        type: "warp.fem"
        material_type: "linear"
        g_vector: [0., -9.81, 0.]
        relative_loss: true
        tv_reg_weight: 1.0e-4
    boundary_condition: {"type": "mesh_key", "value": "u_reg"}
    optimization_kws:
        type: "LBFGS"
        num_trials: 10
        init_scale: 0.1
        global_steps: 10
        local_steps: 100
        rtol: 1.e-5
        max_iter: 1
        max_eval: 20
        line_search_fn: "strong_wolfe"

training:
    split:
        key: "random"
        test_ratio: 0.1
        val_ratio: 0.1
        seed: 0
    transform:
        normalize: true
        image_mean: -650.
        image_std: 150.
        apply_mask: true
        do_augment: false
        rand_rotate: false
        rand_reflect: false
        sigma_trans: 0.0
    loader: {"batch_size": 1, "shuffle": true, "seed": 1234}
    task:
        inputs: ["image"]
        targets: ["E"]
        losses: {"E": "sim"}
    model:
        backbone:
            type: UNet3D
            out_channels: 16
            n_conv_units: 2
            n_unet_levels: 2
            kernel_size: 3
            relu_leak: 0.1
            norm_type: "group"
            num_groups: 4
            pooling_type: "max"
            upsample_mode: "trilinear"
        heads:
            E: {"mode": "log10", "v_loc": 3000., "scale": 0.3271}
            nu: {"mode": "logit", "v_min": 0.0001, "v_max": 0.4999}
            rho: {"mode": "log10", "v_loc": 250., "scale": 0.1}
    optimizer: {"type": "AdamW", "lr": 1.0e-4}
    pde_solver:
        type: "warp.fem"
        material_type: "linear"
        g_vector: [0., -9.81, 0.]
        relative_loss: true
        tv_reg_weight: 1.0e-4
    boundary_condition: {"type": "mesh_key", "value": "u_reg"}
    trainer:
        num_epochs: 10
        val_interval: 1
        test_interval: 1
        save_interval: 1

